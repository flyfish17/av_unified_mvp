<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>实时转写 · av_unified_mvp</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --line: #30363d;
      --text: #e6edf3;
      --dim: #8b949e;
      --live: #f0b429;
      --final: #2ea043;
      --accent: #58a6ff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 15px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      display: flex; flex-direction: column;
    }
    header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--line);
      display: flex; align-items: center; gap: 12px;
    }
    header h1 { font-size: 16px; margin: 0; font-weight: 600; }
    .status {
      font-size: 12px; color: var(--dim);
      padding: 2px 8px; border: 1px solid var(--line); border-radius: 999px;
    }
    .status.ok    { color: var(--final); border-color: var(--final); }
    .status.warn  { color: var(--live);  border-color: var(--live); }
    main {
      flex: 1; overflow-y: auto; padding: 20px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .bubble {
      max-width: 720px; padding: 10px 14px; border-radius: 12px;
      background: var(--panel); border: 1px solid var(--line);
      white-space: pre-wrap; word-break: break-word;
    }
    .bubble .meta {
      font-size: 11px; color: var(--dim); margin-top: 6px;
    }
    .bubble.live {
      border-color: var(--live); border-style: dashed;
    }
    .bubble.live .meta::before { content: "● 转写中 · "; color: var(--live); }
    .bubble.final .meta::before { content: "✓ 定稿 · "; color: var(--final); }
    /* partial 逐字追加闪光（讯飞观感）— 新增字符出现瞬间橙黄高亮 0.5s fade */
    .bubble .text .tx-flash { animation: tx-flash-in 0.5s ease-out; }
    @keyframes tx-flash-in {
      0%   { color: var(--live); text-shadow: 0 0 8px rgba(240, 180, 41, 0.85); }
      100% { color: inherit;     text-shadow: none; }
    }
    footer {
      padding: 10px 20px; border-top: 1px solid var(--line);
      font-size: 12px; color: var(--dim);
    }
    kbd {
      background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
      padding: 1px 5px; font-size: 11px;
    }
  </style>
</head>
<body>
  <header>
    <h1>实时转写</h1>
    <span id="status" class="status warn">连接中…</span>
    <span style="flex:1"></span>
    <span style="font-size:12px;color:var(--dim)">FunASR 2pass · 边说边出 · 句末标点修正</span>
  </header>
  <main id="feed"></main>
  <footer>
    后端 SSE: <code>/events/transcript</code> · 主程序仍是 <code>python main.py</code> · 演示页参考 woldmonitor 架构
  </footer>
  <script src="/static/transcript.js"></script>
</body>
</html>
