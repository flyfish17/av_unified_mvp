# 应用形态 profile：决定 supervisor 拉起哪些模块（见 main.py APP_PROFILES）。
# full（默认，可省略）= 全部模块；meeting_asr = 纯会议转写（CR-DIG7201-A），
# 不起 video_processor/keyframe_filter/openvocab_filter，CPU 全给转写+纪要。
# app_profile: meeting_asr
audio:
  # 音频来源（CR-DIG7201 P1）：mic（本地麦，默认）| net_multicast（会议主机 8 路组播）
  # 可列表共存：source: [mic, net_multicast]
  # source: net_multicast
  # net_multicast:
  #   group: 224.1.1.11
  #   base_port: 1000        # 8 路 = 1000-1007，端口号定话筒路号
  #   num_channels: 8
  #   gate_threshold: 150    # int16 RMS 静音门阈值，闲路不占 FunASR decoder
  #   gate_hangover_ms: 1800 # 静音门关门等待：词间停顿(<1.8s)不强制结算 final，防碎句
  #   mic_names:             # 物理话筒ID(组播包头16bit ID,日志"首包头部 ID"可见) → 发言人名；
  #                          # ⚠️ key 不是端口路号——主机会动态重分配话筒→端口(8/20实锤对调)，名字跟话筒实体走；
  #                          # 未配置回退"话筒<ID>"；通常直接在 dashboard 点标签改名，此处仅出厂预配
  #     "1": 张三
  #     "2": 李四
  #   record_session: true   # 会话原音录制（gate 后有声混音落盘 data/recordings/ + :5052 导出），默认开
  funasr:
    mode: websocket_2pass
    sample_rate: 16000
    chunk_size:
    - 5
    - 10
    - 5
    chunk_interval: 10
    chunk_interval_ms: 60
    hotwords: ''            # 额外热词 json {词:权重}；人名/术语请改 config/glossary.yaml（自动合并，config 优先）
    ws_giveup_after_s: 120  # FunASR WS 连续断联多久才降级 local_offline（服务端崩溃自愈约 20s，别设太短）
    use_itn: true
    silence_duration_ms: 600
    silence_threshold: 0.012
    url: ws://127.0.0.1:10095
llm:
  # 纪要 LLM 后端（CR-DIG7201 P0-b）。缺省 = ollama CPU；上 NPU 时取消注释：
  # summary:
  #   backend: rkllm                                        # ollama | rkllm
  #   url: http://127.0.0.1:8000/v1/chat/completions        # RKLLM-API-Server
  #   model: qwen3-4b-16k
  #   unload_url: http://127.0.0.1:8000/v1/models/unload    # 跑完释放 NPU 内存
  ollama:
    model_fast: qwen3.5:4b
    model_smart: qwen3.5:4b
    timeout: 30
    url: http://127.0.0.1:11434/api/generate
mqtt:
  broker: 127.0.0.1
  client_id: av_box_001
  port: 1883
  topics:
    audio_command: av/audio/command
    audio_partial: av/audio/partial
    control: av/control
    discovery: av/discovery
    video_detect: av/video/detect
router:
  rules:
  - source_topic: av/audio/event
    target_topics:
    - av/llm/command
    condition: payload.get('payload', {}).get('event_type') == 'transcription'
  - source_topic: av/llm/event
    target_topics:
    - av/control/command
    - av/dashboard/display
    condition: payload.get('payload', {}).get('command') is not None
  - source_topic: av/video/event
    target_topics:
    - av/dashboard/display
    - av/node_red/input
    condition: payload.get('payload', {}).get('event_type') == 'detection'
  - source_topic: av/dashboard/command
    target_topics:
    - av/control/command
  - source_topic: av/node_red/command
    target_topics:
    - av/control/command
system:
  log_level: INFO
  max_cpu_percent: 70
  performance_profile: medium
video:
  sources:
  - enabled: true
    name: 本机摄像头
    url: '0'
  - enabled: true
    name: 监控
    url: rtsp://admin:${IPC_PWD}@192.168.5.181:554/Streaming/Channels/801
  - enabled: true
    name: 分布式
    url: rtsp://192.168.5.31:554/live/chn2
  - enabled: true
    name: 财务监控
    url: rtsp://admin:${IPC_PWD}@192.168.5.181:554/Streaming/Channels/1101
  # 视频墙"单路"模式（dashboard 默认）只保留这一路：会议室摄像头，给转写做发言人区分。
  # 其余路在单路模式下被前端 disable（停解码/停 JPEG，CPU 让给 FunASR）；点"四分屏"才全开（会提示停转写）。
  # 不填 = 第一路。
  meeting_camera: 本机摄像头
  yolo:
    confidence: 0.5
    inference_fps: 2
    # yolov8n.pt = ultralytics CPU 推理(3588 上 ~250ms/帧,吃 2-3 核);
    # yolov8n_rknn_model = 同模型 NPU 版(仓库自带,62 实测 106ms/帧、进程 CPU 减半,检出一致;
    # 需 venv 装 rknn-toolkit-lite2==2.3.2)。RK3588 板子一律用 rknn 版,Mac/Jetson 用 .pt。
    model: yolov8n.pt
    target_classes:
    - 0
    - 67
    - 73
web:
  host: 0.0.0.0
  mdns_name: avbox1
  port: 8501
  transcript_enabled: true
  transcript_port: 5050
# 门禁联动（modules/door_access）：门口摄像头 person → dashboard 弹窗 → 云眸远程开门
# 秘钥在 open2.hik-cloud.com 秘钥管理页；协议见 设备协议/门禁开门协议.docx
# door_access:
#   enabled: true
#   client_id: xxxxxxxx
#   client_secret: xxxxxxxx
#   device_serial: E51574183
#   door_id: "1"
#   camera_name: 门口          # av/video/detect 的 camera 字段等于此值才触发弹窗
#   person_confidence: 0.6
#   visitor_cooldown_s: 30
husion:
  host: 192.168.5.253
  port: 6000
  id_ranges:
  - - 5001
    - 5009
  poll_interval: 30

# ── 发言人区分（声纹，本机麦路径）── 回流自 av_understanding_mac 2026-07-29 S1-S5
# CAM++ 逐句嵌入 + 在线余弦质心聚类；订 av/audio/segment（audio_processor 落盘的 final 段）→ 发 av/audio/diarization。
# 前端按 segment_id 回填 S1/S2… 标签并切段；纪要按段归属。会议主机路径（net_multicast）用话筒号，不走这里。
# 模型需离线预置：~/.cache/modelscope/hub/models/iic/speech_campplus_sv_zh-cn_16k-common（有网机 snapshot_download 后拷）。
# 准确度边界：<1s 短段不开新簇只归已有簇；远场同人短段余弦 p25≈0.30 逼近异人上限 0.28，近讲可上调 threshold。
speaker_diarizer:
  enabled: false
  mode: campp_embed
  allow_download: false
  spk_model: iic/speech_campplus_sv_zh-cn_16k-common
  threshold: 0.35
# audio.segments（enabled 时 audio_processor 落盘 final 段）：
#   audio:
#     segments:
#       dir: runtime/audio_segments
#       max_files: 300

# ── 品牌（配置 + 素材，不是分支；2026-08-21 拍板）──
# name: 顶栏 tag / 页面标题 / bigscreen 前缀；product: 顶栏主标题 / splash；
# logo: web/static/brand/ 下文件名，空 = 纯文字（CREATOR 默认态）。
# 湖森 DNC（62）：name: Husion湖森 / product: AI 视听理解平台 / logo: husion.png
brand:
  name: CREATOR
  product: AI 视听理解平台
  logo: ""
